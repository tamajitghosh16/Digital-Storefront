# Weekly dependency updates (docs/security-roadmap.md, Phase 2.3). Security
# updates are raised immediately regardless of this schedule once
# "Dependabot security updates" is enabled in the repo settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Major versions are migrations, not routine bumps (e.g. Prisma 7 or
    # Next 17), so Dependabot doesn't raise them; upgrade those by hand.
    # This only affects scheduled version updates — security updates for a
    # major version still come through.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Every minor/patch bump lands in one PR, so a weekly run is one Vercel
    # preview per app instead of one per package.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
